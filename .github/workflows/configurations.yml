name: Compiler Checks

on:
  push:
  pull_request:
  release:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ matrix.compiler.name }} (CMake: ${{ matrix.cmake-version || 'latest' }}, ROOT: ${{ matrix.root-version.name }})"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release ]
        compiler:
          - { name: "GCC-13",   cc: "gcc-13",   cxx: "g++-13",     package: g++-13 }
          - { name: "GCC-14",   cc: "gcc-14",   cxx: "g++-14",     package: g++-14 }
          - { name: "Clang-14", cc: "clang-14", cxx: "clang++-14", package: clang-14 }
          - { name: "Clang-16", cc: "clang-16", cxx: "clang++-16", package: clang-16 }
          - { name: "Clang-18", cc: "clang-18", cxx: "clang++-18", package: clang-18 }
        cmake-version: [ "", "3.28.3" ]
        root-version:
          - {
              name: "6.22.08",
              url: "http://gccb.if.uj.edu.pl/code/root-cpp17_6.22.08_amd64.deb",
              cxx_flags: "--std=c++17 -include cstdint",
              cmake_args: "-DCMAKE_CXX_STANDARD=17"
            }
          - {
              name: "6.24.00",
              url: "http://gccb.if.uj.edu.pl/code/root-cpp17_6.24.00_amd64.deb",
              cxx_flags: "-include cstdint",
              cmake_args: ""
            }
          - {
              name: "6.30.12",
              url: "https://root.cern/download/root_v6.30.12.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz",
              cxx_flags: "-include cstdint",
              cmake_args: ""
            }
          - {
              name: "6.38.06",
              url: "https://root.cern/download/root_v6.38.06.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz",
              cxx_flags: "-include cstdint",
              cmake_args: ""
            }

    steps:
      - name: Print env
        run: |
          echo github.event.action: ${{ github.event.action }}
          echo github.event_name: ${{ github.event_name }}

      - name: Install common dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ${{ matrix.compiler.package }}
          sudo apt-get install -y \
            cmake libgtest-dev lcov rapidjson-dev libcurl4-openssl-dev \
            python3-numpy libtbb-dev libxxhash0 libxxhash-dev liblz4-dev libzstd-dev \
            libxpm-dev libxft-dev libxext-dev libx11-dev libxmu-dev \
            libssl-dev libgsl-dev libpcre2-dev libfftw3-dev libxml2-dev \
            libgl1 libglu1-mesa libgif7 libjpeg-turbo8 libtiff6
          ROOT_FILE=$(basename "${{ matrix.root-version.url }}")
          wget --tries=4 --waitretry=5 --retry-connrefused -q "${{ matrix.root-version.url }}"
          if [[ "${ROOT_FILE}" == *.deb ]]; then
            sudo dpkg -i "${ROOT_FILE}"
          else
            sudo mkdir -p /opt/root
            sudo tar -xzf "${ROOT_FILE}" -C /opt/root --strip-components=1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ matrix.cmake-version }}

      - name: Configure
        shell: bash
        run: |
          . /etc/profile
          if [[ -f /opt/root/bin/thisroot.sh ]]; then
            source /opt/root/bin/thisroot.sh
          fi
          root-config --version
          root-config --cflags
          root-config --features
          EXTRA_CMAKE_ARGS=""
          if [[ "${{ matrix.compiler.cc }}" == clang* ]]; then
            EXTRA_CMAKE_ARGS="-DDABC_cpp_LIBRARY=$(g++ -print-file-name=libstdc++.so)"
          fi
          cmake \
            -S . \
            -B build \
            -DENABLE_TESTING=On \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.root-version.cxx_flags }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX:PATH=instdir \
            ${EXTRA_CMAKE_ARGS} \
            ${{ matrix.root-version.cmake_args }}

      - name: Build
        shell: bash
        run: |
          if [[ -f /opt/root/bin/thisroot.sh ]]; then
            source /opt/root/bin/thisroot.sh
          fi
          cmake --build build --config ${{ matrix.build_type }} -j $(nproc) || cmake --build build --config ${{ matrix.build_type }} -j 1

      - name: Test
        shell: bash
        run: |
          if [[ -f /opt/root/bin/thisroot.sh ]]; then
            source /opt/root/bin/thisroot.sh
          fi
          ctest --test-dir build --output-on-failure
