name: Compiler Checks

on:
  push:
  pull_request:
  release:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ matrix.compiler-name }} (CMake: ${{ matrix.cmake-version }}, ROOT: ${{ matrix.root-version }})"
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash -el {0}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ROOT 6.28.* (LTS floor — conda-forge caps GCC at 12.*)
          - root-version: "6.28.*"
            cmake-version: "3.28.*"
            compiler-name: "GCC-12"
            pkg: "gcc_linux-64=12.* gxx_linux-64=12.*"
            cc: "x86_64-conda-linux-gnu-gcc"
            cxx: "x86_64-conda-linux-gnu-g++"
            build-type: "Release"

          - root-version: "6.28.*"
            cmake-version: "4.*"
            compiler-name: "GCC-12"
            pkg: "gcc_linux-64=12.* gxx_linux-64=12.*"
            cc: "x86_64-conda-linux-gnu-gcc"
            cxx: "x86_64-conda-linux-gnu-g++"
            build-type: "Release"

          - root-version: "6.28.*"
            cmake-version: "4.*"
            compiler-name: "Clang-18"
            pkg: "clang_linux-64=18.* clangxx_linux-64=18.* gxx_linux-64=12.*"
            cc: "x86_64-conda-linux-gnu-clang"
            cxx: "x86_64-conda-linux-gnu-clang++"
            build-type: "Release"

          # ROOT 6.34.* (Latest C++17-default ROOT series on conda-forge)
          - root-version: "6.34.*"
            cmake-version: "4.*"
            compiler-name: "GCC-12"
            pkg: "gcc_linux-64=12.* gxx_linux-64=12.*"
            cc: "x86_64-conda-linux-gnu-gcc"
            cxx: "x86_64-conda-linux-gnu-g++"
            build-type: "Release"

          - root-version: "6.34.*"
            cmake-version: "4.*"
            compiler-name: "GCC-13"
            pkg: "gcc_linux-64=13.* gxx_linux-64=13.*"
            cc: "x86_64-conda-linux-gnu-gcc"
            cxx: "x86_64-conda-linux-gnu-g++"
            build-type: "Release"

          - root-version: "6.34.*"
            cmake-version: "3.28.*"
            compiler-name: "GCC-14"
            pkg: "gcc_linux-64=14.* gxx_linux-64=14.*"
            cc: "x86_64-conda-linux-gnu-gcc"
            cxx: "x86_64-conda-linux-gnu-g++"
            build-type: "Release"

          - root-version: "6.34.*"
            cmake-version: "4.*"
            compiler-name: "GCC-14"
            pkg: "gcc_linux-64=14.* gxx_linux-64=14.*"
            cc: "x86_64-conda-linux-gnu-gcc"
            cxx: "x86_64-conda-linux-gnu-g++"
            build-type: "Release"

          - root-version: "6.34.*"
            cmake-version: "4.*"
            compiler-name: "Clang-18"
            pkg: "clang_linux-64=18.* clangxx_linux-64=18.* gxx_linux-64=13.*"
            cc: "x86_64-conda-linux-gnu-clang"
            cxx: "x86_64-conda-linux-gnu-clang++"
            build-type: "Release"

    steps:
      - name: Print env
        run: |
          echo github.event.action: ${{ github.event.action }}
          echo github.event_name: ${{ github.event_name }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sifi-ci
          cache-downloads: true
          create-args: >-
            -c conda-forge
            root_base=${{ matrix.root-version }}
            cmake=${{ matrix.cmake-version }}
            ${{ matrix.pkg }}
            make
            gtest
            rapidjson
            libcurl
            gsl
            tbb-devel
            xxhash
            numpy
            lcov

      - name: Configure
        run: |
          root-config --version
          root-config --cflags
          root-config --features
          export CXXFLAGS="${CXXFLAGS} -include cstdint"
          EXTRA_CMAKE_ARGS=""
          if [[ "${{ matrix.compiler-name }}" == Clang* ]]; then
            EXTRA_CMAKE_ARGS="-DDABC_cpp_LIBRARY=$(x86_64-conda-linux-gnu-g++ -print-file-name=libstdc++.so)"
          fi
          cmake \
            -S . \
            -B build \
            -DENABLE_TESTING=On \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH="${CONDA_PREFIX}" \
            -DCMAKE_C_COMPILER="${{ matrix.cc }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_INSTALL_PREFIX:PATH=instdir \
            ${EXTRA_CMAKE_ARGS}

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build-type }} -j $(nproc) || cmake --build build --config ${{ matrix.build-type }} -j 1

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
